<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JOINT TRAINING</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="image_2e8be5.jpg">

  <style>
    /* 基本デザイン */
    body { background-color: #0a0a0a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
    header { background-color: #111111; color: #ffffff; text-align: center; padding: 18px 0; font-size: 18px; font-weight: 900; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; letter-spacing: 2px; }
    .container { max-width: 480px; margin: 0 auto; padding: 20px; }
    
    /* UIパーツ */
    .section-title { color: #888; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    .btn-primary { background-color: #ffffff; color: #000000; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
    .btn-secondary { background-color: transparent; color: #ffffff; border: 1px solid #555; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .part-btn { background-color: #1a1a1a; color: #aaa; border: 1px solid #444; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: inline-block; margin: 0 5px 10px 0; }
    .part-btn.selected { background-color: #ffffff; color: #000000; border-color: #ffffff; }
    
    /* 入力フォーム */
    .input-field { width: 100%; background-color: #1a1a1a; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; box-sizing: border-box; }
    textarea.input-field { resize: vertical; min-height: 80px; }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background-color: #161616; border: 1px solid #333; padding: 20px; border-radius: 12px; width: 80%; max-width: 350px; }

    /* フレンド・チャット用 */
    .list-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
    .avatar-small { width: 40px; height: 40px; border-radius: 50%; background-color: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; object-fit: cover; }
    .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; display: inline-block; word-wrap: break-word; }
    .chat-me { background-color: #ffffff; color: #000000; border-bottom-right-radius: 4px; }
    .chat-friend { background-color: #333333; color: #ffffff; border-bottom-left-radius: 4px; }
    .chat-input-area { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; padding: 15px; box-sizing: border-box; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 150; padding-bottom: env(safe-area-inset-bottom, 15px); }

    /* 下部タブバー（フローティング） */
    .tab-bar { position: fixed; bottom: 20px; left: 5%; width: 90%; background-color: rgba(17, 17, 17, 0.95); border: 1px solid #333; border-radius: 20px; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .tab-item { color: #666; text-align: center; font-size: 10px; width: 25%; cursor: pointer; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .tab-item.active { color: #ffffff; }
    .tab-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }

    .screen { display: none; animation: fadeIn 0.3s; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

  <script>
    // ▼▼▼ オーナー様のAPIキーを上書きしてください ▼▼▼
    const firebaseConfig = {
      apiKey: "AIzaSyA43zyt2XOK6-Pqwd0AAQcMYIcIqGpUsW4",
      authDomain: "joint-training.firebaseapp.com",
      projectId: "joint-training",
      storageBucket: "joint-training.firebasestorage.app",
      messagingSenderId: "479294292720",
      appId: "1:479294292720:web:bcdb0d54b4c7ce46c9b835",
      measurementId: "G-Q6KXKNPJFH"
    };
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // === 画面制御 ===
    function switchTab(screenId, headerTitle) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      document.getElementById('app-header').innerText = headerTitle;
      
      const tabs = document.getElementById('bottom-tabs');
      if(screenId === 'screen-chat' || screenId === 'screen-login') {
        tabs.style.display = 'none';
      } else {
        tabs.style.display = 'flex';
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        if(event && event.currentTarget.classList) event.currentTarget.classList.add('active');
      }
      window.scrollTo(0, 0);
    }

    // === 認証・プロフィール ===
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => alert("エラー: " + error.message));
    }
    auth.getRedirectResult().catch(error => {
      alert("ログイン失敗の原因: " + error.message);
    });

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('bottom-tabs').style.display = 'flex';
        document.getElementById('my-uid-display').innerText = user.uid;
        switchTab('screen-search', 'JOINT TRAINING');
        applyFilter(); // 初期表示でフィルタ適用（全件）して読み込み
        loadProfile(user.uid);
        loadFriends();
      } else {
        switchTab('screen-login', 'JOINT TRAINING');
      }
    });

    let currentProfileImage = null;
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const MAX = 200;
          let w = img.width, h = img.height;
          if (w > h && w > MAX) { h *= MAX / w; w = MAX; } else if (h > MAX) { w *= MAX / h; h = MAX; }
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          currentProfileImage = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('avatar-container').innerHTML = `<img src="${currentProfileImage}" class="avatar-img" style="margin: 0 auto; width: 80px; height: 80px;">`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loadProfile(uid) {
      db.collection("users").doc(uid).get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('profile-name').value = data.name || auth.currentUser.displayName;
          document.getElementById('profile-bio').value = data.bio || "";
          document.getElementById('profile-history').value = data.history || "";
          document.getElementById('profile-gyms').value = data.gyms || "";
          if (data.photoURL) {
            currentProfileImage = data.photoURL;
            document.getElementById('avatar-container').innerHTML = `<img src="${currentProfileImage}" class="avatar-img" style="margin: 0 auto; width: 80px; height: 80px;">`;
          }
        }
      });
    }

    function saveProfile() {
      db.collection("users").doc(auth.currentUser.uid).set({
        name: document.getElementById('profile-name').value,
        bio: document.getElementById('profile-bio').value,
        history: document.getElementById('profile-history').value,
        gyms: document.getElementById('profile-gyms').value,
        photoURL: currentProfileImage,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).then(() => alert("保存しました！"));
    }

    // === 募集作成・編集機能 ===
    let selectedDates = [];
    let selectedPostAreas = [];
    let selectedPostGyms = [];
    let editingPostId = null; // 編集時はここにIDが入る
    
    // 下のタブから「募集」を押したときは新規作成としてリセットする
    function openPostTabNew() {
      editingPostId = null;
      document.getElementById('post-description').value = "";
      selectedDates = []; renderDates();
      selectedPostAreas = []; renderPostAreas();
      selectedPostGyms = []; renderPostGyms();
      document.querySelectorAll('.part-btn-item').forEach(el => el.classList.remove('selected'));
      switchTab('screen-post', '募集を作成');
    }

    // 追加・削除UIロジック
    function addDate() { const v = document.getElementById('post-date-input').value; if(v && !selectedDates.includes(v)) { selectedDates.push(v); renderDates(); } }
    function renderDates() { document.getElementById('selected-dates-container').innerHTML = selectedDates.map(d => `<div class="part-btn selected" onclick="removeDate('${d}')">${d} ✕</div>`).join(''); }
    function removeDate(d) { selectedDates = selectedDates.filter(x => x !== d); renderDates(); }

    function addPostArea() { const v = document.getElementById('post-area-input').value; if(v && !selectedPostAreas.includes(v)) { selectedPostAreas.push(v); renderPostAreas(); } }
    function renderPostAreas() { document.getElementById('selected-areas-container').innerHTML = selectedPostAreas.map(a => `<div class="part-btn selected" onclick="removePostArea('${a}')">${a} ✕</div>`).join(''); }
    function removePostArea(a) { selectedPostAreas = selectedPostAreas.filter(x => x !== a); renderPostAreas(); }

    function addPostGym() { const v = document.getElementById('post-gym-input').value; if(v && !selectedPostGyms.includes(v)) { selectedPostGyms.push(v); renderPostGyms(); } }
    function renderPostGyms() { document.getElementById('selected-gyms-container').innerHTML = selectedPostGyms.map(g => `<div class="part-btn selected" onclick="removePostGym('${g}')">${g} ✕</div>`).join(''); }
    function removePostGym(g) { selectedPostGyms = selectedPostGyms.filter(x => x !== g); renderPostGyms(); }

    function openConfirmModal() {
      const parts = Array.from(document.querySelectorAll('.part-btn-item.selected')).map(el => el.innerText);
      const desc = document.getElementById('post-description').value;

      if (selectedDates.length === 0 || parts.length === 0 || (selectedPostAreas.length === 0 && selectedPostGyms.length === 0)) {
        return alert("希望日・場所(エリアかジム)・部位をそれぞれ1つ以上選択してください。");
      }

      document.getElementById('confirm-modal-title').innerText = editingPostId ? "この内容で更新しますか？" : "以下の内容で募集しますか？";
      document.getElementById('confirm-content').innerHTML = `
        <strong>📝 メッセージ:</strong><br>${desc ? desc : 'なし'}<br><br>
        <strong>📅 日程:</strong><br>${selectedDates.join(', ')}<br><br>
        <strong>🏙️ エリア:</strong><br>${selectedPostAreas.length > 0 ? selectedPostAreas.join(', ') : '指定なし'}<br><br>
        <strong>📍 ジム:</strong><br>${selectedPostGyms.length > 0 ? selectedPostGyms.join(', ') : '指定なし'}<br><br>
        <strong>💪 部位:</strong><br>${parts.join(', ')}
      `;
      document.getElementById('confirm-modal').style.display = 'flex';
    }

    function closeConfirmModal() { document.getElementById('confirm-modal').style.display = 'none'; }

    // 新規作成 or 編集の保存処理
    function submitPost() {
      const user = auth.currentUser;
      const parts = Array.from(document.querySelectorAll('.part-btn-item.selected')).map(el => el.innerText);
      const desc = document.getElementById('post-description').value;

      db.collection("users").doc(user.uid).get().then(doc => {
        const hostName = doc.exists && doc.data().name ? doc.data().name : user.displayName;
        const photoURL = doc.exists ? doc.data().photoURL : null;
        const bio = doc.exists ? doc.data().bio : "";
        
        const postData = {
          uid: user.uid,
          hostName: hostName,
          hostPhoto: photoURL,
          hostBio: bio,
          description: desc,
          dates: selectedDates,
          areas: selectedPostAreas,
          gyms: selectedPostGyms,
          parts: parts,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editingPostId) {
          // 編集モードの場合（Update）
          db.collection("posts").doc(editingPostId).update(postData).then(() => {
            closeConfirmModal();
            alert("募集内容を更新しました！");
            openPostTabNew(); // リセットして閉じる
            switchTab('screen-search', 'JOINT TRAINING');
          });
        } else {
          // 新規作成の場合（Add）
          postData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          db.collection("posts").add(postData).then(() => {
            closeConfirmModal();
            alert("募集を公開しました！");
            openPostTabNew();
            switchTab('screen-search', 'JOINT TRAINING');
          });
        }
      });
    }

    // 自分の投稿を編集モードで開く
    function editMyPost(postId) {
      db.collection("posts").doc(postId).get().then(doc => {
        const post = doc.data();
        editingPostId = postId;
        document.getElementById('post-description').value = post.description || "";
        
        selectedDates = post.dates || []; renderDates();
        selectedPostAreas = post.areas || []; renderPostAreas();
        selectedPostGyms = post.gyms || []; renderPostGyms();
        
        document.querySelectorAll('.part-btn-item').forEach(el => el.classList.remove('selected'));
        if(post.parts) {
          document.querySelectorAll('.part-btn-item').forEach(el => {
            if(post.parts.includes(el.innerText)) el.classList.add('selected');
          });
        }
        
        // タブの表示状態を切り替える
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-item')[1].classList.add('active'); // 「募集」タブを光らせる
        
        switchTab('screen-post', '募集を編集');
      });
    }

    // 自分の投稿を削除する
    function deleteMyPost(postId) {
      if(confirm("本当にこの募集を削除しますか？")) {
        db.collection("posts").doc(postId).delete().then(() => alert("削除しました。"));
      }
    }

    // === タイムラインとフィルター検索 ===
    let currentFilters = { date: "", area: "", part: "" };

    function applyFilter() {
      currentFilters.date = document.getElementById('filter-date').value;
      currentFilters.area = document.getElementById('filter-area').value;
      currentFilters.part = document.getElementById('filter-part').value;
      loadPosts();
    }

    function loadPosts() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snap => {
        const container = document.getElementById('posts-container');
        container.innerHTML = ""; 
        let visibleCount = 0;
        
        snap.forEach(doc => {
          const post = doc.data();
          const pId = doc.id;
          
          // --- フィルターの判定 ---
          if (currentFilters.date && (!post.dates || !post.dates.includes(currentFilters.date))) return; // 条件不一致はスキップ
          if (currentFilters.area && (!post.areas || !post.areas.includes(currentFilters.area))) return;
          if (currentFilters.part && (!post.parts || (!post.parts.includes(currentFilters.part) && !post.parts.includes("すべて")))) return;

          visibleCount++;
          
          const datesText = post.dates && post.dates.length > 0 ? post.dates.join(", ") : "未定";
          const areasText = post.areas && post.areas.length > 0 ? post.areas.join(", ") : "指定なし";
          const gymsText = post.gyms && post.gyms.length > 0 ? post.gyms.join(", ") : "指定なし";
          const partsText = post.parts && post.parts.length > 0 ? post.parts.join("・") : "未定";
          
          const avatarHtml = post.hostPhoto 
            ? `<img src="${post.hostPhoto}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #555; margin-right: 15px;">` 
            : `<div style="width: 50px; height: 50px; border-radius: 50%; background-color: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; font-size: 20px;">${post.hostName.charAt(0)}</div>`;
          
          const descHtml = post.description ? `<div style="background: #222; padding: 12px; border-radius: 8px; font-size: 13px; margin: 15px 0; line-height: 1.5;">${post.description}</div>` : '';
          const bioHtml = post.hostBio ? `<div style="color: #aaa; font-size: 11px; margin-top: 4px; line-height: 1.3;">${post.hostBio}</div>` : '';

          // 自分の投稿なら「編集・削除」、他人の投稿なら「合トレ完了報告」
          let actionBtn = post.uid === auth.currentUser.uid 
            ? `<div style="display: flex; gap: 10px; margin-top: 15px;">
                 <button class="btn-secondary" style="flex: 1; padding: 10px; margin: 0; font-size: 13px;" onclick="editMyPost('${pId}')">✏️ 編集</button>
                 <button class="btn-secondary" style="flex: 1; padding: 10px; margin: 0; font-size: 13px; border-color: #e74c3c; color: #e74c3c;" onclick="deleteMyPost('${pId}')">🗑 削除</button>
               </div>`
            : `<button class="btn-secondary" style="border-color: #fff; padding: 12px; margin-top: 15px; font-size:13px;" onclick="reportCompletion('${post.uid}', '${post.hostName}')">✅ 合トレ完了を報告してフレンド追加</button>`;

          container.innerHTML += `
            <div style="background-color: #161616; border: 1px solid #333; border-radius: 12px; padding: 18px; margin-bottom: 20px;">
              <div style="display: flex; align-items: center;">
                ${avatarHtml}
                <div style="flex: 1;">
                  <h3 style="margin: 0; font-size: 16px;">${post.hostName}</h3>
                  ${bioHtml}
                </div>
              </div>
              ${descHtml}
              <div style="color: #ccc; font-size: 13px; margin-top: 15px; line-height: 1.8;">
                <div style="display:flex; margin-bottom: 4px;"><span style="width:25px;">📅</span> <span style="flex:1;">${datesText}</span></div>
                <div style="display:flex; margin-bottom: 4px;"><span style="width:25px;">🏙️</span> <span style="flex:1;">${areasText}</span></div>
                <div style="display:flex; margin-bottom: 4px;"><span style="width:25px;">📍</span> <span style="flex:1;">${gymsText}</span></div>
                <div style="display:flex;"><span style="width:25px;">💪</span> <span style="flex:1;">${partsText}</span></div>
              </div>
              ${actionBtn}
            </div>
          `;
        });
        
        if (visibleCount === 0) {
          container.innerHTML = "<p style='color:#888; text-align:center;'>条件に一致する募集がありません。</p>";
        }
      });
    }

    // === 合トレ完了報告 ＆ フレンド機能 ===
    function reportCompletion(targetUid, targetName) {
      if(confirm(`${targetName}さんとの合トレ完了を報告しますか？\n\n※報告を行うと相手がフレンドに追加され、メッセージ機能が解放されます。`)) {
        addFriend(targetUid);
      }
    }
    function searchAndAddFriend() { addFriend(document.getElementById('search-uid').value.trim()); }

    function addFriend(targetUid) {
      const myUid = auth.currentUser.uid;
      if(!targetUid) return alert("IDが入力されていません");
      if(myUid === targetUid) return alert("自分自身は追加できません");

      db.collection("users").doc(myUid).set({ friends: firebase.firestore.FieldValue.arrayUnion(targetUid) }, {merge:true});
      db.collection("users").doc(targetUid).set({ friends: firebase.firestore.FieldValue.arrayUnion(myUid) }, {merge:true});
      
      alert("フレンドに追加しました！チャット画面からメッセージが可能です。");
      document.getElementById('search-uid').value = "";
    }

    function loadFriends() {
      const myUid = auth.currentUser.uid;
      db.collection("users").doc(myUid).onSnapshot(doc => {
        const friends = doc.data()?.friends || [];
        const container = document.getElementById('friends-container');
        container.innerHTML = "";
        
        if(friends.length === 0) {
          container.innerHTML = "<p style='color:#888; font-size:13px;'>まだフレンドがいません。</p>";
          return;
        }

        friends.forEach(fUid => {
          db.collection("users").doc(fUid).get().then(fDoc => {
            const fData = fDoc.data() || {};
            const name = fData.name || "名称未設定";
            const avatarHtml = fData.photoURL 
              ? `<img src="${fData.photoURL}" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #555; margin-right: 15px;">` 
              : `<div class="avatar-small" style="width: 45px; height: 45px;">${name.charAt(0)}</div>`;
            
            container.innerHTML += `
              <div class="list-item" onclick="openChat('${fUid}', '${name}')">
                ${avatarHtml}
                <div style="font-weight: bold; font-size: 16px;">${name}</div>
              </div>
            `;
          });
        });
      });
    }

    // チャット画面ロジック
    let currentChatId = null;
    let chatUnsubscribe = null;

    function openChat(friendUid, friendName) {
      currentChatId = [auth.currentUser.uid, friendUid].sort().join('_');
      switchTab('screen-chat', friendName);
      
      if(chatUnsubscribe) chatUnsubscribe();
      chatUnsubscribe = db.collection("chats").doc(currentChatId).collection("messages")
        .orderBy("createdAt", "asc")
        .onSnapshot(snap => {
          const msgBox = document.getElementById('chat-messages');
          msgBox.innerHTML = "";
          snap.forEach(doc => {
            const msg = doc.data();
            const isMe = msg.sender === auth.currentUser.uid;
            const align = isMe ? "flex-end" : "flex-start";
            const bubbleClass = isMe ? "chat-me" : "chat-friend";
            
            msgBox.innerHTML += `
              <div style="display: flex; justify-content: ${align}; width: 100%;">
                <div class="chat-bubble ${bubbleClass}">${msg.text}</div>
              </div>
            `;
          });
          window.scrollTo(0, document.body.scrollHeight);
        });
    }

    function closeChat() {
      if(chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
      currentChatId = null;
      switchTab('screen-friends', 'フレンド');
    }

    function sendMessage() {
      if(!currentChatId) return;
      const text = document.getElementById('chat-text').value.trim();
      if(!text) return;
      db.collection("chats").doc(currentChatId).collection("messages").add({
        sender: auth.currentUser.uid,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => { document.getElementById('chat-text').value = ""; });
    }
  </script>
</body>
</html>
