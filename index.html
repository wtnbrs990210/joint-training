<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JOINT TRAINING</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="image_2e8be5.jpg">

  <style>
    /* 基本デザイン */
    body { background-color: #0a0a0a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
    header { background-color: #111111; color: #ffffff; text-align: center; padding: 18px 0; font-size: 18px; font-weight: 900; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; letter-spacing: 2px; }
    .container { max-width: 480px; margin: 0 auto; padding: 20px; }
    
    /* UIパーツ */
    .section-title { color: #888; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    .btn-primary { background-color: #ffffff; color: #000000; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
    .btn-secondary { background-color: transparent; color: #ffffff; border: 1px solid #555; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
    .part-btn { background-color: #1a1a1a; color: #aaa; border: 1px solid #444; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: inline-block; margin: 0 5px 10px 0; }
    .part-btn.selected { background-color: #ffffff; color: #000000; border-color: #ffffff; }
    
    /* 入力フォーム */
    .input-field { width: 100%; background-color: #1a1a1a; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; box-sizing: border-box; }
    textarea.input-field { resize: vertical; min-height: 80px; }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background-color: #161616; border: 1px solid #333; padding: 20px; border-radius: 12px; width: 80%; max-width: 350px; }

    /* フレンドリスト・アイコン */
    .list-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
    .avatar-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #333; }
    .avatar-small { width: 40px; height: 40px; border-radius: 50%; background-color: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; object-fit: cover; }

    /* チャット画面用 */
    .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; display: inline-block; word-wrap: break-word; }
    .chat-me { background-color: #ffffff; color: #000000; border-bottom-right-radius: 4px; }
    .chat-friend { background-color: #333333; color: #ffffff; border-bottom-left-radius: 4px; }
    .chat-input-area { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; padding: 15px; box-sizing: border-box; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 150; padding-bottom: env(safe-area-inset-bottom, 15px); }

    /* 下部タブバー（フローティング） */
    .tab-bar { position: fixed; bottom: 20px; left: 5%; width: 90%; background-color: rgba(17, 17, 17, 0.95); border: 1px solid #333; border-radius: 20px; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .tab-item { color: #666; text-align: center; font-size: 10px; width: 25%; cursor: pointer; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .tab-item.active { color: #ffffff; }
    .tab-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }

    .screen { display: none; animation: fadeIn 0.3s; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <header id="app-header">JOINT TRAINING</header>

  <div class="container">
    
    <!-- 0. ログイン画面 -->
    <div id="screen-login" class="screen active">
      <div style="text-align: center; margin-top: 50px;">
        <img src="image_2e8be5.jpg" alt="LOGO" style="width: 150px; border-radius: 20px; margin-bottom: 30px;">
        <h2>本気の合トレマッチング</h2>
        <button class="btn-primary" onclick="loginWithGoogle()" style="margin-top: 40px;">Googleでログインして始める</button>
      </div>
    </div>

    <!-- 1. さがす画面（タイムライン） -->
    <div id="screen-search" class="screen">
      <div id="posts-container"><p style="color: #888; text-align: center;">募集データを読み込み中...</p></div>
    </div>

    <!-- 2. 募集する画面 -->
    <div id="screen-post" class="screen">
      
      <div style="margin-bottom: 30px;">
        <div class="section-title">📝 募集メッセージ（任意）</div>
        <textarea id="post-description" class="input-field" placeholder="「脚トレ追い込み合える方募集！」「合トレ初心者ですがお願いします！」など" style="min-height: 60px;"></textarea>
      </div>

      <!-- 日程の複数選択 -->
      <div style="margin-bottom: 30px;">
        <div class="section-title">📅 希望日（複数追加できます）</div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <input type="date" id="post-date-input" class="input-field" style="margin: 0;">
          <button class="btn-secondary" style="margin: 0; width: 80px;" onclick="addDate()">追加</button>
        </div>
        <div id="selected-dates-container"></div>
      </div>

      <!-- ジムの複数選択（プルダウンから） -->
      <div style="margin-bottom: 30px;">
        <div class="section-title">📍 開催ジム（複数追加できます）</div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <select id="post-gym-input" class="input-field" style="margin: 0;">
            <option value="">選択してください</option>
            <option value="エニタイムフィットネス">エニタイムフィットネス</option>
            <option value="FASTGYM24">FASTGYM24</option>
            <option value="JOYFIT24">JOYFIT24</option>
            <option value="FiT24">FiT24</option>
            <option value="FIT PLACE24">FIT PLACE24</option>
            <option value="FIT365">FIT365</option>
            <option value="chocoZAP">chocoZAP</option>
            <option value="LIFE FIT">LIFE FIT</option>
            <option value="スポーツクラブルネサンス">スポーツクラブルネサンス</option>
            <option value="コナミスポーツクラブ">コナミスポーツクラブ</option>
            <option value="セントラルスポーツ">セントラルスポーツ</option>
            <option value="ティップネス">ティップネス</option>
            <option value="メガロス">メガロス</option>
            <option value="ジェクサー">ジェクサー</option>
            <option value="スポーツクラブNAS">スポーツクラブNAS</option>
            <option value="Gold's Gym">Gold's Gym</option>
            <option value="カーブス">カーブス</option>
            <option value="Bodies">Bodies</option>
            <option value="FURDI">FURDI</option>
            <option value="公営ジムメイン">公営ジムメイン</option>
            <option value="その他">その他</option>
          </select>
          <button class="btn-secondary" style="margin: 0; width: 80px;" onclick="addPostGym()">追加</button>
        </div>
        <div id="selected-gyms-container"></div>
      </div>
      
      <div style="margin-bottom: 30px;">
        <div class="section-title">💪 メイン部位</div>
        <div class="part-btn part-btn-item" onclick="this.classList.toggle('selected')">すべて</div>
        <div class="part-btn part-btn-item" onclick="this.classList.toggle('selected')">胸</div>
        <div class="part-btn part-btn-item" onclick="this.classList.toggle('selected')">背中</div>
        <div class="part-btn part-btn-item" onclick="this.classList.toggle('selected')">脚</div>
        <div class="part-btn part-btn-item" onclick="this.classList.toggle('selected')">肩</div>
        <div class="part-btn part-btn-item" onclick="this.classList.toggle('selected')">腕</div>
      </div>
      
      <button class="btn-primary" onclick="openConfirmModal()">内容を確認する</button>
    </div>

    <!-- 3. フレンド＆メッセージ一覧画面 -->
    <div id="screen-friends" class="screen">
      <div class="section-title">IDでフレンド追加</div>
      <p style="font-size: 11px; color: #888; margin-top: -5px; line-height: 1.4;">※タイムラインからのフレンド追加は「合トレ完了報告」後のみ可能です。<br>事前に連絡を取りたい場合はIDを検索してください。</p>
      <div style="display: flex; gap: 10px; margin-bottom: 30px;">
        <input type="text" id="search-uid" class="input-field" placeholder="相手のIDを入力" style="margin: 0;">
        <button class="btn-secondary" style="margin: 0; width: 100px;" onclick="searchAndAddFriend()">追加</button>
      </div>

      <div class="section-title">フレンド一覧（タップしてチャット）</div>
      <div id="friends-container"><p style="color: #888; font-size: 13px;">まだフレンドがいません。</p></div>
    </div>

    <!-- 3-5. 個別チャット画面 -->
    <div id="screen-chat" class="screen">
      <div id="chat-messages" style="display: flex; flex-direction: column; padding-bottom: 20px;"></div>
      <div class="chat-input-area">
        <button class="btn-secondary" style="width: 50px; margin: 0; padding: 10px;" onclick="closeChat()">戻る</button>
        <input type="text" id="chat-text" class="input-field" placeholder="メッセージを入力..." style="margin: 0;">
        <button class="btn-primary" style="width: 70px; margin: 0; padding: 10px;" onclick="sendMessage()">送信</button>
      </div>
    </div>

    <!-- 4. マイページ（設定）画面 -->
    <div id="screen-mypage" class="screen">
      <div style="text-align: center; margin-bottom: 20px; position: relative;">
        <div id="avatar-container" onclick="document.getElementById('profile-image-upload').click()" style="cursor: pointer; display: inline-block; position: relative;">
          <div class="avatar-small" style="width: 80px; height: 80px; font-size: 30px; margin: 0 auto;" id="mypage-avatar">U</div>
        </div>
        <input type="file" id="profile-image-upload" accept="image/*" style="display: none;" onchange="previewImage(event)">
        <!-- 自分のID表示 -->
        <div style="margin-top: 15px; font-size: 13px; color: #888;">
          あなたのID: <span id="my-uid-display" style="color: #fff; font-weight: bold; user-select: all;"></span>
        </div>
      </div>
      
      <div class="section-title">表示名</div>
      <input type="text" id="profile-name" class="input-field" placeholder="名前を入力">
      
      <div class="section-title">自己紹介</div>
      <textarea id="profile-bio" class="input-field" placeholder="得意な種目や普段のトレーニング内容などを入力"></textarea>
      
      <div class="section-title">筋トレ歴</div>
      <select id="profile-history" class="input-field">
        <option value="">選択してください</option>
        <option value="1年未満">1年未満</option>
        <option value="1〜3年">1〜3年</option>
        <option value="3〜5年">3〜5年</option>
        <option value="5〜10年">5〜10年</option>
        <option value="10年以上">10年以上</option>
      </select>

      <div class="section-title">メインの契約ジム</div>
      <select id="profile-gyms" class="input-field">
        <option value="">選択してください</option>
        <option value="エニタイムフィットネス">エニタイムフィットネス</option>
        <option value="FASTGYM24">FASTGYM24</option>
        <option value="JOYFIT24">JOYFIT24</option>
        <option value="FiT24">FiT24</option>
        <option value="FIT PLACE24">FIT PLACE24</option>
        <option value="FIT365">FIT365</option>
        <option value="chocoZAP">chocoZAP</option>
        <option value="LIFE FIT">LIFE FIT</option>
        <option value="スポーツクラブルネサンス">スポーツクラブルネサンス</option>
        <option value="コナミスポーツクラブ">コナミスポーツクラブ</option>
        <option value="セントラルスポーツ">セントラルスポーツ</option>
        <option value="ティップネス">ティップネス</option>
        <option value="メガロス">メガロス</option>
        <option value="ジェクサー">ジェクサー</option>
        <option value="スポーツクラブNAS">スポーツクラブNAS</option>
        <option value="Gold's Gym">Gold's Gym</option>
        <option value="カーブス">カーブス</option>
        <option value="Bodies">Bodies</option>
        <option value="FURDI">FURDI</option>
        <option value="公営ジムメイン">公営ジムメイン</option>
        <option value="その他">その他</option>
      </select>

      <button class="btn-primary" onclick="saveProfile()">プロフィールを保存する</button>
      <button class="btn-secondary" onclick="firebase.auth().signOut().then(() => location.reload())" style="margin-bottom: 50px;">ログアウト</button>
    </div>
  </div>

  <!-- 投稿確認モーダル -->
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-top: 0;">以下の内容で募集しますか？</h3>
      <div id="confirm-content" style="color: #ccc; font-size: 14px; margin-bottom: 20px; line-height: 1.6;"></div>
      <button class="btn-primary" onclick="submitPost()">募集を確定する</button>
      <button class="btn-secondary" onclick="closeConfirmModal()">キャンセル</button>
    </div>
  </div>

  <!-- 下部タブバー -->
  <div class="tab-bar" id="bottom-tabs" style="display: none;">
    <div class="tab-item active" onclick="switchTab('screen-search', 'JOINT TRAINING')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      さがす
    </div>
    <div class="tab-item" onclick="switchTab('screen-post', '募集を作成')">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      募集
    </div>
    <div class="tab-item" onclick="switchTab('screen-friends', 'フレンド')">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      チャット
    </div>
    <div class="tab-item" onclick="switchTab('screen-mypage', 'マイページ')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      マイページ
    </div>
  </div>

  <script>
    // ▼▼▼ オーナー様のAPIキーを上書きしてください ▼▼▼
    const firebaseConfig = {
      apiKey: "AIzaSyA43zyt2XOK6-Pqwd0AAQcMYIcIqGpUsW4",
      authDomain: "joint-training.firebaseapp.com",
      projectId: "joint-training",
      storageBucket: "joint-training.firebasestorage.app",
      messagingSenderId: "479294292720",
      appId: "1:479294292720:web:bcdb0d54b4c7ce46c9b835",
      measurementId: "G-Q6KXKNPJFH"
    };
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // === 画面制御 ===
    function switchTab(screenId, headerTitle) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      document.getElementById('app-header').innerText = headerTitle;
      
      const tabs = document.getElementById('bottom-tabs');
      if(screenId === 'screen-chat' || screenId === 'screen-login') {
        tabs.style.display = 'none';
      } else {
        tabs.style.display = 'flex';
        document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
        if(event && event.currentTarget.classList) event.currentTarget.classList.add('active');
      }
      window.scrollTo(0, 0);
    }

    // === 認証・プロフィール ===
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider).catch(error => alert("エラー: " + error.message));
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('bottom-tabs').style.display = 'flex';
        document.getElementById('my-uid-display').innerText = user.uid;
        switchTab('screen-search', 'JOINT TRAINING');
        loadPosts();
        loadProfile(user.uid);
        loadFriends();
      } else {
        switchTab('screen-login', 'JOINT TRAINING');
      }
    });

    let currentProfileImage = null;
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const MAX = 200;
          let w = img.width, h = img.height;
          if (w > h && w > MAX) { h *= MAX / w; w = MAX; } 
          else if (h > MAX) { w *= MAX / h; h = MAX; }
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          currentProfileImage = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('avatar-container').innerHTML = `<img src="${currentProfileImage}" class="avatar-img" style="margin: 0 auto; width: 80px; height: 80px;">`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loadProfile(uid) {
      db.collection("users").doc(uid).get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('profile-name').value = data.name || auth.currentUser.displayName;
          document.getElementById('profile-bio').value = data.bio || "";
          document.getElementById('profile-history').value = data.history || "";
          document.getElementById('profile-gyms').value = data.gyms || "";
          if (data.photoURL) {
            currentProfileImage = data.photoURL;
            document.getElementById('avatar-container').innerHTML = `<img src="${currentProfileImage}" class="avatar-img" style="margin: 0 auto; width: 80px; height: 80px;">`;
          }
        }
      });
    }

    function saveProfile() {
      const uid = auth.currentUser.uid;
      db.collection("users").doc(uid).set({
        name: document.getElementById('profile-name').value,
        bio: document.getElementById('profile-bio').value,
        history: document.getElementById('profile-history').value,
        gyms: document.getElementById('profile-gyms').value,
        photoURL: currentProfileImage,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).then(() => alert("保存しました！"));
    }

    // === 募集機能（日程・ジム 複数追加） ===
    let selectedDates = [];
    let selectedPostGyms = [];
    
    // 日程追加
    function addDate() {
      const dateVal = document.getElementById('post-date-input').value;
      if(dateVal && !selectedDates.includes(dateVal)) {
        selectedDates.push(dateVal);
        renderDates();
      }
    }
    function renderDates() {
      document.getElementById('selected-dates-container').innerHTML = selectedDates.map(d => `<div class="part-btn selected" onclick="removeDate('${d}')">${d} ✕</div>`).join('');
    }
    function removeDate(d) {
      selectedDates = selectedDates.filter(x => x !== d);
      renderDates();
    }

    // ジム追加
    function addPostGym() {
      const gymVal = document.getElementById('post-gym-input').value;
      if(gymVal && !selectedPostGyms.includes(gymVal)) {
        selectedPostGyms.push(gymVal);
        renderPostGyms();
      }
    }
    function renderPostGyms() {
      document.getElementById('selected-gyms-container').innerHTML = selectedPostGyms.map(g => `<div class="part-btn selected" onclick="removePostGym('${g}')">${g} ✕</div>`).join('');
    }
    function removePostGym(g) {
      selectedPostGyms = selectedPostGyms.filter(x => x !== g);
      renderPostGyms();
    }

    function openConfirmModal() {
      const parts = Array.from(document.querySelectorAll('.part-btn-item.selected')).map(el => el.innerText);
      const desc = document.getElementById('post-description').value;

      if (selectedPostGyms.length === 0 || parts.length === 0 || selectedDates.length === 0) {
        return alert("希望日・ジム・部位をそれぞれ1つ以上選択してください。");
      }

      document.getElementById('confirm-content').innerHTML = `
        <strong>📝 メッセージ:</strong><br>${desc ? desc : 'なし'}<br><br>
        <strong>📅 日程:</strong><br>${selectedDates.join(', ')}<br><br>
        <strong>📍 場所:</strong><br>${selectedPostGyms.join(', ')}<br><br>
        <strong>💪 部位:</strong><br>${parts.join(', ')}
      `;
      document.getElementById('confirm-modal').style.display = 'flex';
    }

    function closeConfirmModal() { document.getElementById('confirm-modal').style.display = 'none'; }

    function submitPost() {
      const user = auth.currentUser;
      const parts = Array.from(document.querySelectorAll('.part-btn-item.selected')).map(el => el.innerText);
      const desc = document.getElementById('post-description').value;

      db.collection("users").doc(user.uid).get().then(doc => {
        const hostName = doc.exists && doc.data().name ? doc.data().name : user.displayName;
        const photoURL = doc.exists ? doc.data().photoURL : null;
        const bio = doc.exists ? doc.data().bio : "";
        
        db.collection("posts").add({
          uid: user.uid,
          hostName: hostName,
          hostPhoto: photoURL,
          hostBio: bio,
          description: desc,
          dates: selectedDates,
          gyms: selectedPostGyms,
          parts: parts,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          closeConfirmModal();
          alert("募集を公開しました！");
          // 入力リセット
          selectedDates = []; renderDates();
          selectedPostGyms = []; renderPostGyms();
          document.getElementById('post-description').value = "";
          document.querySelectorAll('#screen-post .selected').forEach(el => el.classList.remove('selected'));
          switchTab('screen-search', 'JOINT TRAINING');
        });
      });
    }

    // === タイムライン表示 ===
    function loadPosts() {
      db.collection("posts").orderBy("createdAt", "desc").onSnapshot(snap => {
        const container = document.getElementById('posts-container');
        container.innerHTML = ""; 
        if(snap.empty) return container.innerHTML = "<p style='color:#888; text-align:center;'>募集がありません。</p>";
        
        snap.forEach(doc => {
          const post = doc.data();
          const datesText = post.dates ? post.dates.join(", ") : "";
          const gymsText = post.gyms ? post.gyms.join(", ") : "";
          const partsText = post.parts ? post.parts.join("・") : "";
          
          // 写真を目立たせるレイアウト
          const avatarHtml = post.hostPhoto 
            ? `<img src="${post.hostPhoto}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #555; margin-right: 15px;">` 
            : `<div style="width: 50px; height: 50px; border-radius: 50%; background-color: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; font-size: 20px;">${post.hostName.charAt(0)}</div>`;
          
          // 募集メッセージと自己紹介
          const descHtml = post.description ? `<div style="background: #222; padding: 12px; border-radius: 8px; font-size: 13px; margin: 15px 0; line-height: 1.5;">${post.description}</div>` : '';
          const bioHtml = post.hostBio ? `<div style="color: #aaa; font-size: 11px; margin-top: 4px; line-height: 1.3;">${post.hostBio}</div>` : '';

          // 自分の投稿か、他人の投稿かでボタンを変える
          let actionBtn = post.uid === auth.currentUser.uid 
            ? `<div style="text-align:right; color:#888; font-size:12px; margin-top:15px;">自分の募集</div>`
            : `<button class="btn-secondary" style="border-color: #fff; padding: 12px; margin-top: 15px; font-size:13px;" onclick="reportCompletion('${post.uid}', '${post.hostName}')">✅ 合トレ完了を報告してフレンド追加</button>`;

          container.innerHTML += `
            <div style="background-color: #161616; border: 1px solid #333; border-radius: 12px; padding: 18px; margin-bottom: 20px;">
              <div style="display: flex; align-items: center;">
                ${avatarHtml}
                <div style="flex: 1;">
                  <h3 style="margin: 0; font-size: 16px;">${post.hostName}</h3>
                  ${bioHtml}
                </div>
              </div>
              ${descHtml}
              <div style="color: #ccc; font-size: 13px; margin-top: 15px; line-height: 1.8;">
                <div style="display:flex; margin-bottom: 4px;"><span style="width:25px;">📅</span> <span style="flex:1;">${datesText}</span></div>
                <div style="display:flex; margin-bottom: 4px;"><span style="width:25px;">📍</span> <span style="flex:1;">${gymsText}</span></div>
                <div style="display:flex;"><span style="width:25px;">💪</span> <span style="flex:1;">${partsText}</span></div>
              </div>
              ${actionBtn}
            </div>
          `;
        });
      });
    }

    // === 合トレ完了報告 ＆ フレンド機能 ===
    function reportCompletion(targetUid, targetName) {
      if(confirm(`${targetName}さんとの合トレ完了を報告しますか？\n\n※完了報告を行うと、相手がフレンドに追加され、メッセージ機能が解放されます。`)) {
        addFriend(targetUid);
      }
    }

    function searchAndAddFriend() {
      const targetUid = document.getElementById('search-uid').value.trim();
      addFriend(targetUid);
    }

    function addFriend(targetUid) {
      const myUid = auth.currentUser.uid;
      if(!targetUid) return alert("IDが入力されていません");
      if(myUid === targetUid) return alert("自分自身は追加できません");

      db.collection("users").doc(myUid).set({ friends: firebase.firestore.FieldValue.arrayUnion(targetUid) }, {merge:true});
      db.collection("users").doc(targetUid).set({ friends: firebase.firestore.FieldValue.arrayUnion(myUid) }, {merge:true});
      
      alert("フレンドに追加しました！チャット画面からメッセージが可能です。");
      document.getElementById('search-uid').value = "";
    }

    function loadFriends() {
      const myUid = auth.currentUser.uid;
      db.collection("users").doc(myUid).onSnapshot(doc => {
        const friends = doc.data()?.friends || [];
        const container = document.getElementById('friends-container');
        container.innerHTML = "";
        
        if(friends.length === 0) {
          container.innerHTML = "<p style='color:#888; font-size:13px;'>まだフレンドがいません。</p>";
          return;
        }

        friends.forEach(fUid => {
          db.collection("users").doc(fUid).get().then(fDoc => {
            const fData = fDoc.data() || {};
            const name = fData.name || "名称未設定";
            const avatarHtml = fData.photoURL 
              ? `<img src="${fData.photoURL}" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #555; margin-right: 15px;">` 
              : `<div class="avatar-small" style="width: 45px; height: 45px;">${name.charAt(0)}</div>`;
            
            container.innerHTML += `
              <div class="list-item" onclick="openChat('${fUid}', '${name}')">
                ${avatarHtml}
                <div style="font-weight: bold; font-size: 16px;">${name}</div>
              </div>
            `;
          });
        });
      });
    }

    // チャット画面ロジック
    let currentChatId = null;
    let chatUnsubscribe = null;

    function openChat(friendUid, friendName) {
      currentChatId = [auth.currentUser.uid, friendUid].sort().join('_');
      switchTab('screen-chat', friendName);
      
      if(chatUnsubscribe) chatUnsubscribe();
      chatUnsubscribe = db.collection("chats").doc(currentChatId).collection("messages")
        .orderBy("createdAt", "asc")
        .onSnapshot(snap => {
          const msgBox = document.getElementById('chat-messages');
          msgBox.innerHTML = "";
          snap.forEach(doc => {
            const msg = doc.data();
            const isMe = msg.sender === auth.currentUser.uid;
            const align = isMe ? "flex-end" : "flex-start";
            const bubbleClass = isMe ? "chat-me" : "chat-friend";
            
            msgBox.innerHTML += `
              <div style="display: flex; justify-content: ${align}; width: 100%;">
                <div class="chat-bubble ${bubbleClass}">${msg.text}</div>
              </div>
            `;
          });
          window.scrollTo(0, document.body.scrollHeight);
        });
    }

    function closeChat() {
      if(chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
      currentChatId = null;
      switchTab('screen-friends', 'フレンド');
    }

    function sendMessage() {
      if(!currentChatId) return;
      const text = document.getElementById('chat-text').value.trim();
      if(!text) return;

      db.collection("chats").doc(currentChatId).collection("messages").add({
        sender: auth.currentUser.uid,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('chat-text').value = "";
      });
    }
  </script>
</body>
</html>
